name: Build and deploy blog
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install Stork (search index builder)
        run: |
          curl -sSL -o /usr/local/bin/stork https://github.com/jameslittle230/stork/releases/download/v1.6.0/stork-ubuntu-22-04
          chmod +x /usr/local/bin/stork
          stork --version
      - id: pages
        uses: actions/configure-pages@v5
      - run: pelican content -s publishconf.py -o output
        env:
          SITEURL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
