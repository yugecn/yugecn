name: Build and deploy blog
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      - run: pelican content -s publishconf.py -o output
        env:
          SITEURL: ${{ steps.pages.outputs.base_url }}
      - name: Build search index (Pagefind, Chinese segmentation)
        run: python -m pagefind --site output
      - name: Sync new posts to Blogger
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          SITEURL: ${{ steps.pages.outputs.base_url }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          python tools/blogger_sync.py
          if [ -n "$(git status --porcelain .blogger-sync.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
            git add .blogger-sync.json
            git commit -m "Update Blogger sync state [skip ci]"
            git pull --rebase
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
