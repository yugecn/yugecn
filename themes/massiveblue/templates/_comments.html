{% if GISCUS_REPO_ID %}
<section id="comments" class="comments">
  <h3>评论</h3>
  <script src="https://giscus.app/client.js"
    data-repo="{{ GISCUS_REPO }}" data-repo-id="{{ GISCUS_REPO_ID }}"
    data-category="{{ GISCUS_CATEGORY }}" data-category-id="{{ GISCUS_CATEGORY_ID }}"
    data-mapping="specific" data-term="{{ article.slug }}" data-strict="1"
    data-reactions-enabled="1" data-emit-metadata="0" data-input-position="top"
    data-theme="preferred_color_scheme" data-lang="zh-CN" data-loading="lazy"
    crossorigin="anonymous" async></script>
</section>
{% endif %}
